name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version and latest Docker tags
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKER_IMAGE: jyryu3161/biomarkerpred

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            node scripts/check_release_version.cjs "$RELEASE_REF"
          else
            node scripts/check_release_version.cjs
          fi
          RELEASE_VERSION=$(node -p "require('./gui/package.json').version")
          echo "tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify installed application sources
        run: |
          SOURCES=(Main_Binary.R Binary_TrainAUC_StepwiseSelection.R Main_Survival.R Survival_TrainAUC_StepwiseSelection.R Save_Model.R Predict_New.R ORA_PPI_Analysis.R)
          sha256sum "${SOURCES[@]}" > "$RUNNER_TEMP/expected-sources.sha256"
          docker run --rm "$DOCKER_IMAGE:candidate" sha256sum "${SOURCES[@]}" > "$RUNNER_TEMP/installed-sources.sha256"
          diff -u "$RUNNER_TEMP/expected-sources.sha256" "$RUNNER_TEMP/installed-sources.sha256"

      - name: Test installed R engine with synthetic fixtures
        run: |
          docker run --rm "$DOCKER_IMAGE:candidate" Rscript -e 'stopifnot(all(vapply(c("nsROC", "caret", "ggplot2", "tiff", "reshape2", "systemfonts"), requireNamespace, logical(1), quietly = TRUE)))'
          docker run --rm \
            -v "$PWD/tests/test_survival_bugfixes.R:/tests/test_survival_bugfixes.R:ro" \
            "$DOCKER_IMAGE:candidate" Rscript /tests/test_survival_bugfixes.R

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || inputs.publish == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push' || inputs.publish == true
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          TAG_STATUS=$(curl --silent --show-error --output "$RUNNER_TEMP/published-tag.json" --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/$DOCKER_IMAGE/tags/$RELEASE_TAG")
          if [[ "$TAG_STATUS" != "404" ]]; then
            echo "Refusing to publish: tag $RELEASE_TAG exists or its absence could not be verified (HTTP $TAG_STATUS)." >&2
            exit 1
          fi
          docker tag "$DOCKER_IMAGE:candidate" "$DOCKER_IMAGE:$RELEASE_TAG"
          docker push "$DOCKER_IMAGE:$RELEASE_TAG"
          docker tag "$DOCKER_IMAGE:candidate" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:latest"
