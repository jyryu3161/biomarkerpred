name: Verified release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed version to build, e.g. v0.5.0'
        required: true
        type: string
      publish:
        description: 'Publish after every scientific, OS and image gate passes'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - name: Release gate regression checks
        run: python tests/test_release_review.py
      - id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BMP_VERSION: ${{ inputs.version || github.ref_name }}
          BMP_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: python scripts/release_identity.py
  scientific:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: '--bundles deb rpm appimage'
            label: linux-x64
            bundles: gui/src-tauri/target/release/bundle
          - os: macos-14
            args: '--target universal-apple-darwin'
            label: macos-universal
            bundles: gui/src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-2022
            args: '--bundles msi nsis'
            label: windows-x64
            bundles: gui/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      BMP_TEST_ENGINE_ROOT: ${{ github.workspace }}
      CARGO_BUILD_JOBS: '3'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: release-${{ matrix.label }}
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        if: runner.os == 'Linux'
        with:
          pixi-version: v0.71.2
          locked: true
      - name: Linux runtime and desktop libraries
        if: runner.os == 'Linux'
        run: |
          echo "BMP_TEST_RSCRIPT=$PWD/.pixi/envs/default/bin/Rscript" >> "$GITHUB_ENV"
          echo "BMP_RSCRIPT=$PWD/.pixi/envs/default/bin/Rscript" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev fonts-noto-cjk poppler-utils webkit2gtk-driver xvfb xauth dbus-x11
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: runner.os != 'Linux'
        with:
          r-version: '4.4.3'
          rtools-version: 'none'
          use-public-rspm: false
      - name: Install hash-locked native binary R packages and verify graphics
        if: runner.os != 'Linux'
        run: python scripts/provision_native_r.py --library "${{ runner.temp }}/bmp-r-library" --evidence "${{ runner.temp }}/native-r-runtime.json"
      - name: Native CLI binary/Cox/report workflow
        shell: bash
        run: python tests/test_documented_workflow.py --rscript "$BMP_TEST_RSCRIPT"
      - name: Real R and native process-tree cancellation contracts
        working-directory: gui/src-tauri
        run: cargo fmt --check && cargo test --locked -- --nocapture
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - working-directory: gui
        run: npm ci && npm test && npm run lint
      - name: Build unsigned release installers from verified source
        working-directory: gui
        run: npm run tauri -- build --ci ${{ matrix.args }} -- --locked
      - name: Install pinned native WebDriver intermediary
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Installed Linux desktop IPC (real R, no mocks)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python scripts/ci_installed_desktop.py --bundles "${{ matrix.bundles }}" --rscript "$BMP_TEST_RSCRIPT" --output "${{ runner.temp }}/installed-desktop"
      - name: Installed Windows MSI and NSIS IPC / macOS installed engine and launch
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/ci_installed_desktop.py --bundles "${{ matrix.bundles }}" --rscript "$BMP_TEST_RSCRIPT" --output "${{ runner.temp }}/installed-desktop"
      - name: Collect installers and exact source identity
        run: python scripts/collect_release_assets.py --bundles "${{ matrix.bundles }}" --platform "${{ matrix.label }}" --sha "${{ needs.prepare.outputs.sha }}" --verification "${{ runner.temp }}/installed-desktop/installed-verification.json" --output "${{ runner.temp }}/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.label }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-evidence-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/installed-desktop
            ${{ runner.temp }}/native-r-runtime.json
          if-no-files-found: ignore
  engine:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - name: Build and test the image that will be published
        run: |
          docker build --platform linux/amd64 --label org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }} -t jyryu3161/biomarkerpred:${{ needs.prepare.outputs.version }} .
          python tests/test_docker_image.py --image jyryu3161/biomarkerpred:${{ needs.prepare.outputs.version }}
          mkdir -p "$RUNNER_TEMP/engine"
          docker image inspect jyryu3161/biomarkerpred:${{ needs.prepare.outputs.version }} > "$RUNNER_TEMP/engine/image-inspect.json"
          docker save jyryu3161/biomarkerpred:${{ needs.prepare.outputs.version }} | gzip > "$RUNNER_TEMP/engine/image.tar.gz"
          sha256sum "$RUNNER_TEMP/engine/image.tar.gz" > "$RUNNER_TEMP/engine/image.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-engine
          path: ${{ runner.temp }}/engine
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [prepare, scientific, desktop, engine]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-engine
          path: verified-engine
      - name: Verify downloaded source, installers and tested image
        env:
          BMP_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          BMP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/verify_release_assets.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - name: Recheck immutable tag and unpublished version immediately before pushing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BMP_VERSION: ${{ needs.prepare.outputs.version }}
          BMP_PUBLISH: 'true'
        run: python scripts/release_identity.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified image and retain registry digest
        env:
          BMP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker load -i verified-engine/image.tar.gz
          python scripts/verify_loaded_image.py
          docker push "jyryu3161/biomarkerpred:$BMP_RELEASE_VERSION"
          docker tag "jyryu3161/biomarkerpred:$BMP_RELEASE_VERSION" jyryu3161/biomarkerpred:latest
          docker push jyryu3161/biomarkerpred:latest
          docker image inspect "jyryu3161/biomarkerpred:$BMP_RELEASE_VERSION" > release-assets/published-image.json
      - name: Publish complete GitHub release with source, checksums and notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BMP_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          BMP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/publish_release.py
