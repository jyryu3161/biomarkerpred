name: Scientific and desktop contracts
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  scientific:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: v0.71.2
          locked: true
      - name: Fonts and PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - run: ./install.sh
      - run: python -m pip install -r tests/requirements-browser.txt
      - name: R acceptance and CLI/helper processes
        run: ./scripts/ci_scientific.sh
      - name: Release publication gate regressions
        run: python tests/test_release_review.py
      - name: Documented examples
        run: python tests/test_documented_workflow.py --rscript "$PWD/.pixi/envs/default/bin/Rscript"
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm install --global npm@11.9.0
      - working-directory: gui
        run: npm ci && npm test && npm run lint && npm run build && npm audit --audit-level=high
  integration:
    needs: [scientific, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: v0.71.2
          locked: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: ci-linux-x64
      - name: Native build dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev fonts-noto-cjk poppler-utils
      - name: Build and test installed production image
        run: |
          docker build --platform linux/amd64 -t biomarkerpred-engine:local .
          python tests/test_docker_image.py --image biomarkerpred-engine:local
      - name: Real R process trees, Docker orchestration and Rust contracts
        working-directory: gui/src-tauri
        env:
          BMP_TEST_RSCRIPT: ${{ github.workspace }}/.pixi/envs/default/bin/Rscript
          BMP_TEST_ENGINE_ROOT: ${{ github.workspace }}
          BMP_TEST_DOCKER_IMAGE: biomarkerpred-engine:local
          BMP_TEST_DOCKER_PATH: /usr/bin/docker
          CARGO_BUILD_JOBS: '2'
        run: cargo fmt --check && cargo test --locked -- --nocapture
      - name: Bundled engine resources
        run: python tests/test_engine_resources.py --engine-root gui/src-tauri/resources/engine --rscript "$PWD/.pixi/envs/default/bin/Rscript"
      - name: Build UI and install pinned browser
        run: |
          cd gui
          npm ci && npm run build
          cd ..
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Synthetic browser and HTML report interactions (simulated desktop IPC)
        run: python scripts/ci_browser.py --rscript "$PWD/.pixi/envs/default/bin/Rscript" --output "$RUNNER_TEMP/browser-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-synthetic-evidence
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: ignore
