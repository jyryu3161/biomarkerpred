name: GUI Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: ubuntu-22.04
            label: Linux
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Check release version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            node scripts/check_release_version.cjs "$RELEASE_REF"
          else
            node scripts/check_release_version.cjs
          fi

      - name: Test frontend
        working-directory: gui
        run: npm test

      - name: Test Rust
        working-directory: gui/src-tauri
        run: cargo test --locked

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - name: Fix macOS code signature
        if: matrix.platform == 'macos-latest'
        run: |
          APP_DIR="gui/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_PATH="$APP_DIR/BioMarkerPred.app"
          if [ -d "$APP_PATH" ]; then
            echo "Removing existing signature..."
            codesign --remove-signature "$APP_PATH" || true
            echo "Re-signing with ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            echo "Verifying signature..."
            codesign --verify --verbose "$APP_PATH"
          else
            echo "Warning: $APP_PATH not found"
            find gui/src-tauri/target -name "*.app" -type d 2>/dev/null || true
          fi

      - name: Recreate macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          BUNDLE_DIR="gui/src-tauri/target/universal-apple-darwin/release/bundle"
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          APP_PATH="$BUNDLE_DIR/macos/BioMarkerPred.app"
          if [ -n "$DMG_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Recreating DMG with re-signed app..."
            echo "  DMG: $DMG_PATH"
            echo "  APP: $APP_PATH"
            rm "$DMG_PATH"
            hdiutil create -volname "BioMarkerPred" -srcfolder "$APP_PATH" \
              -ov -format UDZO "$DMG_PATH"
            echo "DMG recreated successfully"
          else
            echo "Warning: DMG or APP not found"
            echo "  DMG_PATH=$DMG_PATH"
            echo "  APP_PATH=$APP_PATH"
          fi

      - name: Verify required platform artifacts
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.label }}
        run: |
          case "$BUILD_PLATFORM" in
            macOS)
              REQUIRED_PATTERNS=("gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg")
              ;;
            Windows)
              REQUIRED_PATTERNS=("gui/src-tauri/target/release/bundle/msi/*.msi" "gui/src-tauri/target/release/bundle/nsis/*.exe")
              ;;
            Linux)
              REQUIRED_PATTERNS=("gui/src-tauri/target/release/bundle/deb/*.deb" "gui/src-tauri/target/release/bundle/appimage/*.AppImage")
              ;;
            *) exit 1 ;;
          esac
          for PATTERN in "${REQUIRED_PATTERNS[@]}"; do
            if ! compgen -G "$PATTERN" > /dev/null; then
              echo "Missing required artifact: $PATTERN" >&2
              exit 1
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BioMarkerPred-${{ matrix.label }}
          path: |
            gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/msi/*.msi
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
          test -f "$NOTES_FILE"
          mapfile -d '' RELEASE_ASSETS < <(find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 | sort -z)
          test "${#RELEASE_ASSETS[@]}" -gt 0
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --verify-tag \
            --title "BioMarkerPred $RELEASE_TAG" \
            --draft \
            --notes-file "$NOTES_FILE" \
            "${RELEASE_ASSETS[@]}"
