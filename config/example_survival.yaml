# Replace paths and column names with those in your own data.
# In Docker, use workdir: "/work" and paths under that mounted directory.
workdir: "."
survival:
  data_file: data/my_data.csv
  sample_id: sample
  event: status          # 1 = event, 0 = censored
  time_variable: time   # Column containing follow-up time
  horizon: 5            # Numeric time, in the same units as time_variable
  split_prop: 0.7
  num_seed: 100
  output_dir: results/survival
  freq: 50
  exclude: []
  include: []
