# Synthetic fixture only; paths resolve relative to this configuration file.
config_version: 1
analysis_type: binary
data_file: ../tests/fixtures/binary.csv
output_dir: ../results/examples/binary
sample_id: sample
group_column: patient
clinical_columns: [age, sex]
outer_folds: 3
inner_folds: 2
repeats: 1
seed: 1
workers: 1
models: [stepwise, elastic_net]
feature_sets: [genes, clinical, combined]
max_features: 3
panel_sizes: [1, 3]
# Small runnable demonstration, not a final research uncertainty budget.
bootstrap_samples: 20
selection_frequency: 0.5
outcome: response
positive_class: "1"
negative_class: "0"
positive_label: "Responder"
negative_label: "Non-responder"
